<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0}body{background:#fff;padding:18px 22px;font-family:var(--font-body);color:var(--ink)}
.cap{font-size:11px;color:var(--fg2);margin-top:3px}</style></head><body>
<div style="display:flex;gap:20px;background:var(--pink-150);padding:18px;border-radius:14px">

<div style="text-align:center"><div style="width:74px;height:54px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm)"></div><div class="cap" style="margin-top:10px"><b style="color:var(--ink)">sm</b></div></div>
<div style="text-align:center"><div style="width:74px;height:54px;background:#fff;border-radius:12px;box-shadow:var(--shadow-md)"></div><div class="cap" style="margin-top:10px"><b style="color:var(--ink)">md</b></div></div>
<div style="text-align:center"><div style="width:74px;height:54px;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg)"></div><div class="cap" style="margin-top:10px"><b style="color:var(--ink)">lg</b></div></div>
<div style="text-align:center"><div style="width:74px;height:54px;background:#fff;border-radius:12px;box-shadow:var(--shadow-mag)"></div><div class="cap" style="margin-top:10px"><b style="color:var(--ink)">mag</b></div></div>
</div></body></html>
