<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);padding:18px 20px}
.swrow{display:flex;gap:0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px 9px}
.sw small{font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:var(--font-body)}
.lab{display:flex;justify-content:space-between;margin-top:8px}
.lab b{font-size:12px}.lab span{font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

</style></head><body>
<div class="swrow">
<div class="sw" style="background:var(--magenta)"><small style="color:#fff">#E33286</small></div>
<div class="sw" style="background:var(--magenta-bright)"><small style="color:#fff">#E91E80</small></div>
<div class="sw" style="background:var(--magenta-deep)"><small style="color:#fff">#C41E6F</small></div>
<div class="sw" style="background:var(--rose)"><small style="color:#fff">#BC4D92</small></div>
<div class="sw" style="background:var(--burgundy)"><small style="color:#fff">#6D1841</small></div>
</div>
<div class="grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px">
<div style="font-size:11px;font-weight:700">Magenta</div>
<div style="font-size:11px;font-weight:700">Hot</div>
<div style="font-size:11px;font-weight:700">Deep</div>
<div style="font-size:11px;font-weight:700">Rose</div>
<div style="font-size:11px;font-weight:700">Burgundy</div>
</div></body></html>
