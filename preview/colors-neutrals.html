<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);padding:18px 20px}
.swrow{display:flex;gap:0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px 9px}
.sw small{font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:var(--font-body)}
.lab{display:flex;justify-content:space-between;margin-top:8px}
.lab b{font-size:12px}.lab span{font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

</style></head><body>
<div class="swrow">
<div class="sw" style="background:var(--black)"><small style="color:#fff">#000000</small></div>
<div class="sw" style="background:var(--ink)"><small style="color:#fff">#3A3C3F</small></div>
<div class="sw" style="background:var(--brown-1)"><small style="color:#fff">#3D3328</small></div>
<div class="sw" style="background:var(--brown-2)"><small style="color:#fff">#775F4E</small></div>
<div class="sw" style="background:#fff"><small style="color:#3A3C3F">#FFFFFF</small></div>
</div>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px">
<div style="font-size:11px;font-weight:700">Black</div>
<div style="font-size:11px;font-weight:700">Ink</div>
<div style="font-size:11px;font-weight:700">Brown 1</div>
<div style="font-size:11px;font-weight:700">Brown 2</div>
<div style="font-size:11px;font-weight:700">White</div>
</div></body></html>
