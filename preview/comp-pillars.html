<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0}body{background:#fff;padding:18px 22px;font-family:var(--font-body);color:var(--ink)}
.cap{font-size:11px;color:var(--fg2)}</style></head><body>
<div style="display:flex;gap:14px">

<div style="transform:skewX(-7deg);background:var(--magenta);border-radius:10px;padding:16px 14px;width:108px;box-shadow:var(--shadow-md)">
<div style="transform:skewX(7deg)"><div style="font-family:var(--font-display);font-weight:800;font-size:26px;color:rgba(255,255,255,.55)">01</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;margin-top:24px">REFRAME</div></div></div>
<div style="transform:skewX(-7deg);background:var(--burgundy);border-radius:10px;padding:16px 14px;width:108px;box-shadow:var(--shadow-md)">
<div style="transform:skewX(7deg)"><div style="font-family:var(--font-display);font-weight:800;font-size:26px;color:rgba(255,255,255,.55)">02</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;margin-top:24px">REDISCOVER</div></div></div>
<div style="transform:skewX(-7deg);background:var(--brown-1);border-radius:10px;padding:16px 14px;width:108px;box-shadow:var(--shadow-md)">
<div style="transform:skewX(7deg)"><div style="font-family:var(--font-display);font-weight:800;font-size:26px;color:rgba(255,255,255,.55)">03</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;margin-top:24px">CONNECT</div></div></div>
<div style="transform:skewX(-7deg);background:var(--magenta-deep);border-radius:10px;padding:16px 14px;width:108px;box-shadow:var(--shadow-md)">
<div style="transform:skewX(7deg)"><div style="font-family:var(--font-display);font-weight:800;font-size:26px;color:rgba(255,255,255,.55)">04</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;margin-top:24px">CARRY FWD</div></div></div>
</div>
<div class="cap" style="margin-top:12px">"What you gain" pillars · skewed parallelogram cards, index numeral + label</div></body></html>
