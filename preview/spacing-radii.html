<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0}body{background:#fff;padding:18px 22px;font-family:var(--font-body);color:var(--ink)}
.cap{font-size:11px;color:var(--fg2);margin-top:3px}</style></head><body>
<div style="display:flex;gap:16px;align-items:flex-end">

<div style="text-align:center"><div style="width:70px;height:60px;background:var(--pink-200);border:2px solid var(--magenta);border-radius:8px"></div><div class="cap"><b style="color:var(--ink)">sm</b> 8px</div></div>
<div style="text-align:center"><div style="width:70px;height:60px;background:var(--pink-200);border:2px solid var(--magenta);border-radius:14px"></div><div class="cap"><b style="color:var(--ink)">md</b> 14px</div></div>
<div style="text-align:center"><div style="width:70px;height:60px;background:var(--pink-200);border:2px solid var(--magenta);border-radius:22px"></div><div class="cap"><b style="color:var(--ink)">lg</b> 22px</div></div>
<div style="text-align:center"><div style="width:70px;height:60px;background:var(--pink-200);border:2px solid var(--magenta);border-radius:32px"></div><div class="cap"><b style="color:var(--ink)">xl</b> 32px</div></div>
<div style="text-align:center"><div style="width:70px;height:60px;background:var(--pink-200);border:2px solid var(--magenta);border-radius:999px"></div><div class="cap"><b style="color:var(--ink)">pill</b> pill</div></div>
</div></body></html>
