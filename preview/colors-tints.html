<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);padding:18px 20px}
.swrow{display:flex;gap:0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px 9px}
.sw small{font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:var(--font-body)}
.lab{display:flex;justify-content:space-between;margin-top:8px}
.lab b{font-size:12px}.lab span{font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

</style></head><body>
<div class="swrow" style="box-shadow:inset 0 0 0 1px var(--line)">
<div class="sw" style="background:var(--pink-100)"><small style="color:#3A3C3F">#FDF3EE</small></div>
<div class="sw" style="background:var(--pink-150)"><small style="color:#3A3C3F">#F9E7F7</small></div>
<div class="sw" style="background:var(--pink-200)"><small style="color:#3A3C3F">#F6D9EE</small></div>
<div class="sw" style="background:var(--pink-300)"><small style="color:#3A3C3F">#F0A8D8</small></div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px">
<div style="font-size:11px;font-weight:700">Pink 100</div>
<div style="font-size:11px;font-weight:700">Pink 150</div>
<div style="font-size:11px;font-weight:700">Pink 200</div>
<div style="font-size:11px;font-weight:700">Pink 300</div>
</div></body></html>
