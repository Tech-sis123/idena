<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0}body{background:#fff;padding:18px 22px;font-family:var(--font-body);color:var(--ink)}
.cap{font-size:11px;color:var(--fg2);margin-top:3px}</style></head><body>
<div style="display:flex;flex-direction:column;gap:6px">

<div style="display:flex;align-items:center;gap:10px"><div style="width:8px;height:14px;background:var(--magenta);border-radius:3px"></div><span class="cap"><b style="color:var(--ink)">s-2</b> · 8px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:16px;height:14px;background:var(--magenta);border-radius:3px"></div><span class="cap"><b style="color:var(--ink)">s-4</b> · 16px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:24px;height:14px;background:var(--magenta);border-radius:3px"></div><span class="cap"><b style="color:var(--ink)">s-5</b> · 24px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:14px;background:var(--magenta);border-radius:3px"></div><span class="cap"><b style="color:var(--ink)">s-6</b> · 32px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:48px;height:14px;background:var(--magenta);border-radius:3px"></div><span class="cap"><b style="color:var(--ink)">s-7</b> · 48px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:64px;height:14px;background:var(--magenta);border-radius:3px"></div><span class="cap"><b style="color:var(--ink)">s-8</b> · 64px</span></div>
</div><div class="cap" style="margin-top:6px">8-point base grid</div></body></html>
