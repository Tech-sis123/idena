<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);padding:18px 20px}
.swrow{display:flex;gap:0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px 9px}
.sw small{font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:var(--font-body)}
.lab{display:flex;justify-content:space-between;margin-top:8px}
.lab b{font-size:12px}.lab span{font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)">
<div style="height:48px;background:var(--gold)"></div>
<div style="background:var(--gold-bg);padding:9px 10px"><b style="font-size:12px">Gold</b><div style="font-size:10.5px;color:var(--brown-2)">#D4AF37 / #FDF7E1</div></div></div>
<div style="border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)">
<div style="height:48px;background:var(--silver)"></div>
<div style="background:var(--silver-bg);padding:9px 10px"><b style="font-size:12px">Silver</b><div style="font-size:10.5px;color:var(--brown-2)">#9A9A9A / #F5F5F7</div></div></div>
<div style="border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)">
<div style="height:48px;background:var(--bronze)"></div>
<div style="background:var(--bronze-bg);padding:9px 10px"><b style="font-size:12px">Bronze</b><div style="font-size:10.5px;color:var(--brown-2)">#CD7F32 / #FDF3EE</div></div></div>
</div></body></html>
